<polyline points="1510,685 1510,640" fill="none" stroke="#365d7c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#use)" /><polyline points="1600,735 1630,735 1630,500 1490,500 1490,480" fill="none" stroke="#365d7c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#use)" /><rect x="40" y="820" width="1600" height="320" rx="14" fill="#fbfcfe" stroke="#b7cbd7" stroke-width="2" /><text x="60" y="854" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#173a55">LECTURA UML Y DECISIONES DE ARQUITECTURA</text><polyline points="65,890 160,890" fill="none" stroke="#365d7c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#use)" /><text x="180" y="897" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">Dependencia «use»: el origen necesita el servicio o contrato de destino.</text><polyline points="65,935 150,935" fill="none" stroke="#365d7c" stroke-width="2" stroke-dasharray="none" /><circle cx="160" cy="935" r="9" fill="white" stroke="#365d7c" stroke-width="2" /><text x="180" y="942" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">Interfaz proporcionada: ReportRepository por datos; CommunityActions por CommunityViewModel.</text><text x="65" y="990" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">La UI observa StateFlow y envía acciones. Los repositorios encapsulan los SDK y las transacciones.</text><text x="65" y="1025" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">No hay API REST propia, microservicios ni capa de casos de uso. El cliente no publica reglas ni administra permisos.</text><text x="65" y="1060" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">Cloud Shell administra configuración y reglas por separado. Firestore autoriza documentos; Storage autoriza archivos.</text><text x="65" y="1095" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#173a55">Storage requiere bucket operativo y reglas. La simulación local es otra compilación y queda fuera de este despliegue.</text><text x="65" y="1125" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173a55">Storage consulta autor y contador en Firestore para autorizar evidencias.</text><text x="45" y="1170" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173a55">Fuente: implementación CIVITA 1.1.742 · Notación UML 2.5.1 · Una única lámina A3 horizontal</text></svg>