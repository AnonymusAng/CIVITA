amily="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.9815" x="36.214" y="224.9355">-db: FirebaseFirestore</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.0214" x="36.214" y="264.0354">-storage: FirebaseStorage</text><line style="stroke:#173B63;stroke-width:0.5;" x1="23.214" x2="676.6918" y1="280.5994" y2="280.5994"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="605.0919" x="36.214" y="311.1353">+CommunityRepository(auth: FirebaseAuth, db: FirebaseFirestore, storage: FirebaseStorage)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.3457" x="36.214" y="350.2352">-uid(): String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="255.471" x="36.214" y="389.3351">-report(id: String): DocumentReference</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.1272" x="36.214" y="428.435">-user(): DocumentReference</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="521.386" x="36.214" y="467.5349">-observe&lt;T&gt;(query: Query, transform: (DocumentSnapshot) -&gt; T): Flow&lt;List&lt;T&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.2572" x="36.214" y="506.6348">+ensureProfile(): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.4511" x="36.214" y="545.7347">+isModerator(): Boolean {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.425" x="36.214" y="584.8346">+observeProfile(): Flow&lt;UserProfile?&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.0567" x="36.214" y="623.9345">+observePreferences(): Flow&lt;UserPreferences&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277.2969" x="36.214" y="663.0344">+saveProfile(name: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="480.5902" x="36.214" y="702.1343">+savePreferences(radius: Long, categoryIds: List&lt;String&gt;): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="627.4778" x="36.214" y="741.2342">+subscribe(categoryId: String, latitude: Double, longitude: Double, radius: Long): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="312.2129" x="36.214" y="780.3341">+removeSubscription(id: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.071" x="36.214" y="819.434">+markRead(id: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.6131" x="36.214" y="858.5339">+events(): Flow&lt;List&lt;UrbanEvent&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="297.1349" x="36.214" y="897.6338">+notifications(): Flow&lt;List&lt;UserNotification&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.0148" x="36.214" y="936.7337">+subscriptions(): Flow&lt;List&lt;AlertSubscription&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.8272" x="36.214" y="975.8336">+layers(): Flow&lt;List&lt;MapLayer&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.9347" x="36.214" y="1014.9335">+features(layerId: String): Flow&lt;List&lt;LayerFeature&gt;&gt;</text></g><g class="entity" data-qualified-name="GMN3" data-source-line="49" id="ent0004"><path d="M124.714,1080.0999 L124.714,1190.4995 A4,4 0 0 0 128.714,1194.4995 L570.6704,1194.4995 A4,4 0 0 0 574.6704,1190.4995 L574.6704,1086.0999 L564.6704,1076.0999 L353.714,1076.0999 L349.714,1031.3699 L345.714,1076.0999 L128.714,1076.0999 A4,4 0 0 0 124.714,1080.0999" fill="#FFF7DE" style="stroke:#D4B66B;stroke-width:0.5;"/><path d="M564.6704,1076.0999 L564.6704,1084.0999 A2,2 0 0 0 566.6704,1086.0999 L574.6704,1086.0999 L564.6704,1076.0999" fill="#FFF7DE" style="stroke:#D4B66B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="379.8186" x="138.714" y="1107.6358">Perfil y preferencias se crean en una transacci&#243;n al entrar.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="401.8404" x="138.714" y="1130.7357">S&#243;lo se escriben campos editables; el rol privilegiado procede</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="412.6904" x="138.714" y="1153.8356">del custom claim verificado del token, no del documento users.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="412.9564" x="138.714" y="1176.9355">Los listeners se retiran mediante awaitClose al cancelar el flujo.</text></g><g class="legend" data-source-line="54"><rect fill="none" height="118.3996" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="661.9058" x="12" y="1212.4995"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="395.6105" x="25" y="1244.0354">+ p&#250;blico &#183; - privado &#183; {suspend} operaci&#243;n suspendida Kotlin</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="430.6104" x="25" y="1267.1353">Flecha continua: referencia de objetos. Discontinua: dependencia.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="635.9058" x="25" y="1290.2352">Las relaciones por identificador se muestran en el MER, no como campos de objetos inexistentes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544.3601" x="25" y="1313.3351">Data classes generan constructor, copy, componentN, equals, hashCode y toString.</text></g><?plantuml-src ZLRRJYD747sVhoWfBqOnAB3Sv217DiOAMY0R37alpvJjNdgwPxjxJ9pLVjK-HCfZ-B6SdZ5uVDaal0nTTUfUVTh-IPc27USqvlHfwcnfiakhhQFlXjLVujyGcKour65eJRZZN6Z4ne_4gSbkp4Zz8NHut50QcucNWevF6aB7vcbBg9MHi2Y42giNyT3G5Pnboapfl27pCyxiSvHEMFickgeejSw8MxFeEMUVbvMU79sUdVKQobIpzxqGd1gNGQvJQwfYVjY4zBTwTZ8y7_QtODPbufQGmxDt_TDtcv2VXG7PyZSONFM6HqsmpGjhn8J_4VeD-g_X2pZYgQo1pWUzq_xvskI2z7SioDdWQXFLz3Cuxf-UzfEPoeGaByA2Sid7udmjIfLBjIH11IrqUVtRzKEF3WyE3ywEZ-ZlF-dIvdbfL5ZSIs6z2jOjelYNGXod2gLvYavAbCYq82rfA1qdITNGdTON5tFb0KQwgMBTMHbZn1vxoxxRfSy9VR_BlCLbc7Leg9oCsKiFfpPbuvKaVZsGqgRuGLTNkb4js4jedxRzHEbEJr7nBLzHLwgijTUX4LRLJAF08LqNMYfx5K8xi6cPez1xcOWJazQMNbphMqexXdOk5m_TrgTItA93lyPFcmAkgvzObtUezMevCbpucGrxjD-b1xWSQljySODEmxuRcobehfCFpawKbXZq4PsbpxxqXPZiIuGeVmjsS8pI8g1lhHOswvXbLWq_LQH7I9UodxfhkDUI_0RsJLx1FQzy6X1RetFRUTRWbMF7cIfzXswicROfvI1JhCfr5aMn0xMhxcvVvTYdu1XfhUnUWxT9Cov6cKaSKJdMM2gD61kYPlYTCPpaTYwZEb8HS6tMTsFR8cVtT0yw-Y-Sp37xLMUhQX_-NtSijhru-MkiLMeZP-zN1SIqS7ZR8h8rbSU-B6KgOtfl0vxy1CEHTCQHceCo9NTerUH8_7RyKOBr1pHGVeN99BgfGB50ZCCXu-Lp0MeaF3mcB9laOirv2QfrzRXGr-tLVTKnF9_sTHwhQ8JV8hzN7GiIEpXWF1_LWmFtqzX7E8gFIN1bYYK19TXYqLuzndTjaaybVgIqQSP-TWdIm_u4MwzarS-wa_y0?></g></svg>