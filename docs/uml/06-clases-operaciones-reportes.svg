<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="974px" preserveAspectRatio="none" style="width:693px;height:974px;background:#FFFFFF;" version="1.1" viewBox="0 0 693 974" width="693px" zoomAndPan="magnify"><title>CIVITA 1.1.742 &#183; CommunityRepository &#183; Participaci&#243;n y moderaci&#243;n</title><defs/><g><g class="title" data-source-line="22"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="467.4301" x="109.2378" y="36.5359">CIVITA 1.1.742 &#183; CommunityRepository &#183; Participaci&#243;n y moderaci&#243;n</text></g><!--class CommunityRepository--><g class="entity" data-qualified-name="CommunityRepository" data-source-line="24" id="ent0002"><rect fill="#F5F8FB" height="565.3986" rx="4" ry="4" style="stroke:#173B63;stroke-width:0.5;" width="478.8683" x="109.9747" y="67.0999"/><rect fill="#DDEAF2" height="88.1998" rx="4" ry="4" style="stroke:#DDEAF2;stroke-width:0.5;" width="478.8683" x="109.9747" y="67.0999"/><rect fill="#DDEAF2" height="4" style="stroke:#DDEAF2;stroke-width:0.5;" width="478.8683" x="109.9747" y="151.2997"/><rect fill="none" height="565.3986" rx="4" ry="4" style="stroke:#173B63;stroke-width:0.5;" width="478.8683" x="109.9747" y="67.0999"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="147.5174" x="275.6502" y="98.6358">&#171;vista parcial: reportes&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.0554" x="275.8812" y="137.7357">CommunityRepository</text><line style="stroke:#173B63;stroke-width:0.5;" x1="110.9747" x2="587.843" y1="155.2997" y2="155.2997"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="346.7506" x="123.9747" y="185.8356">+comments(id: String): Flow&lt;List&lt;ReportComment&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="348.8507" x="123.9747" y="224.9355">+validations(id: String): Flow&lt;List&lt;ReportValidation&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="323.4268" x="123.9747" y="264.0354">+supports(id: String): Flow&lt;List&lt;ReportSupport&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="328.6487" x="123.9747" y="303.1353">+evidence(id: String): Flow&lt;List&lt;ReportEvidence&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="304.3869" x="123.9747" y="342.2352">+history(id: String): Flow&lt;List&lt;StatusChange&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="447.0184" x="123.9747" y="381.3351">+comment(id: String, body: String, requestId: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="320.2628" x="123.9747" y="420.435">+validate(id: String, value: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="231.6851" x="123.9747" y="459.5349">+support(id: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301.7688" x="123.9747" y="498.6348">+flag(id: String, details: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="437.3025" x="123.9747" y="537.7347">+moderate(id: String, status: String, reason: String): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="450.8683" x="123.9747" y="576.8346">+uploadEvidence(id: String, context: Context, uri: Uri): Unit {suspend}</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.6149" x="123.9747" y="615.9345">+evidenceUrl(path: String): String {suspend}</text></g><g class="entity" data-qualified-name="GMN3" data-source-line="39" id="ent0004"><path d="M103.4747,681.0999 L103.4747,814.5994 A4,4 0 0 0 107.4747,818.5994 L591.431,818.5994 A4,4 0 0 0 595.431,814.5994 L595.431,687.0999 L585.431,677.0999 L353.4747,677.0999 L349.4747,632.3299 L345.4747,677.0999 L107.4747,677.0999 A4,4 0 0 0 103.4747,681.0999" fill="#FFF7DE" style="stroke:#D4B66B;stroke-width:0.5;"/><path d="M585.431,677.0999 L585.431,685.0999 A2,2 0 0 0 587.431,687.0999 L595.431,687.0999 L585.431,677.0999" fill="#FFF7DE" style="stroke:#D4B66B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="409.2745" x="117.4747" y="708.6358">Comentario: requestId estable para reintentos sin duplicaci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290.4008" x="117.4747" y="731.7357">Validaci&#243;n y apoyo: ID del documento = UID.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="448.0683" x="117.4747" y="754.8356">Moderaci&#243;n: reporte + historial + acci&#243;n + buz&#243;n en una transacci&#243;n.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="454.9563" x="117.4747" y="777.9355">Evidencia: upload Storage, transacci&#243;n de metadatos y contador &lt;= 3;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="425.2065" x="117.4747" y="801.0354">si falla antes de confirmar, se intenta limpiar el archivo hu&#233;rfano.</text></g><g class="legend" data-source-line="45"><rect fill="none" height="118.3996" rx="4" ry="4" style="stroke:#000000;stroke-width:1;" width="661.9058" x="12" y="836.5994"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="395.6105" x="25" y="868.1353">+ p&#250;blico &#183; - privado &#183; {suspend} operaci&#243;n suspendida Kotlin</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="430.6104" x="25" y="891.2352">Flecha continua: referencia de objetos. Discontinua: dependencia.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="635.9058" x="25" y="914.3351">Las relaciones por identificador se muestran en el MER, no como campos de objetos inexistentes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544.3601" x="25" y="937.435">Data classes generan constructor, copy, componentN, equals, hashCode y toString.</text></g><?plantuml-src ZLN9ZkCs4BthAmh8PO9nZFHcDnnF0ruHOnO4xVJSorBPPbeY5PBg7izWFYZd70BacFwnF4fgMsuxdlXWKCLNZwnN2zszqZbRpcZ1yVtAca8d8vCQIzzDor_ajeX4bboaVcgq_y2Pq9orcujLo-EOkVeiT7RPsDGc4ISvNLurZ9Rr_O4nLLhy9XVAJRe97uszd9D4wHLTDsnkpObv3DObfww9BYEAZTLYzpm6rfh7EjAhyqwtEsXinYaxD_3UgaNXPHORNGRpuql8y42pg-drT7W0CpOHMqFEkXV3piLBoC_2W1pmZSUJmVIy2JPPRhHe_p-Eta9F7f-3Y5Uo1xeU3ph3wxtCUHaUAP3kUF8IrUGPNmuxdM6qLecGPBdVK2RPGgohJB6oSIgHLpuL6iq-pduTq5dxhDszFAT__gAHoR92Ax-vbTmuvOtT1FClRBsA5UwjdlxK14wKbQs-egXKywXhl_-Wd6S4R6F5QOyizgmNTtD3No9w7GJB89TxfP8UpP5ylVg-HzFKFFRVmRD_M-975Uhc9hWySAeIziheRtXzt08hHrVamVmDhtc5gbpa0PhfM4wxJ6fKvRF61cB_BvUvPr-uqPhrgdQeDMWuj6XXaitkoyhlXJW_QpBUGMhwuWgNYqw-DeIHFI8O2pdfLikoVzz3s3BbrHvp8fvLwauwLMNouagkLA0P7JkZJ_8KUMeucHncemNrj9TFleVwAnSjAgm2XrL7cPupUcVJLpdxTUFOQj60Vur2To4NtfkCpF9OYKV1YEonLQQtInJXdnTeiT2bC2lSJNlZo2bD2S9HSTKzxOYgEdtkBCxD1aopCGHEAJ5n4UWDlQ6xsHZezxlEsxRJjkhGOrXpN96zfaNnEIn4Kw6PFEQ-gpV1LCkfk5Vh2mMCnLngxI5n3umGpoWjt7zJ2ex9Rwd_XYv-YX1HU01I9aQCBg21M2gRiKMkXQhG6UzBbYksXAWm3TRgmT2wUFh3BbcRTWJ1oraMfR8AwqhqaB7ywUy5v39X3lr0kLKFE3ryR1D59d-MX6eR1AMtnkCPYz1x4g-vlBVI1GVLbcBBoCDjpU8tGMHj6YktmoGIQ4eGf7h73bufpi1qTtWXBGNjl5eYZq4Bn9c5p4Ete3PYV3-vRI6YqDtuOxmB